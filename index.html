<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pecuniae Ratio</title>
<meta name="description" content="Calcula cuánto puedes gastar hoy, controla tarjetas, créditos, ahorros y gastos hormiga, y compara mes a mes.">
<meta name="theme-color" content="#23408E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pecuniae Ratio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#18213A; --muted:#5B6478; --line:#D8DEE8;
  --brand:#23408E; --brand-ink:#FFFFFF; --ok:#0E8A62; --ok-soft:#DDF3EA; --warn:#9A6514; --warn-soft:#FBEFD8;
  --bad:#C2413A; --bad-soft:#FBE3E1; --ant:#8A5A2B; --ant-soft:#F3E7DA; --empty:#E3E8EF;
  --num:"Sora", "Segoe UI", system-ui, sans-serif; --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141F; --surface:#182033; --surface2:#1E273D; --ink:#E7EBF3; --muted:#9AA4B8; --line:#2A3450;
    --brand:#8FA8F0; --brand-ink:#10141F; --ok:#3CC594; --ok-soft:#173A31; --warn:#E3B04B; --warn-soft:#3A3020;
    --bad:#F07A72; --bad-soft:#3E2124; --ant:#D3A06B; --ant-soft:#3A2D20; --empty:#252F47; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141F; --surface:#182033; --surface2:#1E273D; --ink:#E7EBF3; --muted:#9AA4B8; --line:#2A3450;
  --brand:#8FA8F0; --brand-ink:#10141F; --ok:#3CC594; --ok-soft:#173A31; --warn:#E3B04B; --warn-soft:#3A3020;
  --bad:#F07A72; --bad-soft:#3E2124; --ant:#D3A06B; --ant-soft:#3A2D20; --empty:#252F47; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.top-in h1{font-family:var(--num);font-size:1.05rem;margin:0;font-weight:600;flex:1 1 auto}
.monthpick{display:flex;align-items:center;gap:6px}
select,input{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:5px 9px;font-size:.85rem}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--muted);padding:6px 8px;border-radius:6px;font-size:1rem;line-height:1}
.icon-btn:hover{color:var(--bad);background:var(--bad-soft)}
nav.tabs{max-width:980px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:8px 10px 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:none;background:none;padding:9px 12px 11px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.status{font-size:.8rem;color:var(--muted)}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
section.panel h2{font-family:var(--num);font-size:1.05rem;margin:0 0 4px;font-weight:600}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 14px;max-width:70ch}
/* Hero */
.hero{display:grid;gap:18px}
.hero .lead{font-size:.95rem;color:var(--muted);margin:0}
.hero .big{font-family:var(--num);font-weight:700;font-size:clamp(2.6rem,9vw,4.4rem);line-height:1;margin:4px 0 6px;letter-spacing:-.03em}
.hero .big.neg{color:var(--bad)}
.hero .sub{margin:0;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:4px;margin-top:4px}
.day{aspect-ratio:1;border-radius:6px;background:var(--empty);display:grid;place-items:center;font-size:.7rem;color:var(--muted);font-family:var(--num);position:relative}
.day.ok{background:var(--ok-soft);color:var(--ok)}
.day.over{background:var(--bad-soft);color:var(--bad)}
.day.zero{background:var(--ok);color:#fff}
.day.today{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.alert{border-radius:10px;padding:10px 12px;font-size:.9rem}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stat{background:var(--surface);padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat .v{font-family:var(--num);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)} .stat .v.ant{color:var(--ant)}
.stat .s{font-size:.75rem;color:var(--muted)}
/* Quick add */
.quick{display:grid;grid-template-columns:1.1fr 1.6fr 1fr 1fr;gap:8px;align-items:end}
.quick label{display:grid;gap:4px;font-size:.78rem;color:var(--muted)}
.quick input,.quick select{width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
.seg button{border:none;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button[data-v="hormiga"][aria-pressed="true"]{background:var(--ant);color:#fff}
.seg button[data-v="ingreso"][aria-pressed="true"]{background:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:.84rem;cursor:pointer}
.chip:hover{border-color:var(--ant);color:var(--ant)}
/* Lists */
.rows{display:grid;gap:8px}
.row{display:grid;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.row label{display:grid;gap:3px;font-size:.75rem;color:var(--muted)}
.row input,.row select{width:100%;background:var(--surface)}
.row .calc{font-size:.78rem;color:var(--muted);align-self:center}
.row .calc b{color:var(--ink);font-family:var(--num);font-weight:600}
.r-ing{grid-template-columns:2fr 1.3fr 1.2fr 1.1fr 1fr auto}
.r-gas{grid-template-columns:2fr 1.2fr 1.1fr 1.1fr 1fr 1.2fr auto}
.r-deu{grid-template-columns:2fr 1.2fr 1.1fr .8fr .8fr 1.2fr auto}
.r-tar{grid-template-columns:repeat(4,1fr)}
.r-mov{grid-template-columns:1fr 1.8fr .9fr 1.1fr .7fr auto}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.total{font-family:var(--num);font-weight:600}
.empty{color:var(--muted);font-size:.9rem;padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:.8rem}
td.num{font-family:var(--num)}
.scroll{overflow-x:auto}
.up{color:var(--bad)} .down{color:var(--ok)} .upg{color:var(--ok)} .downg{color:var(--bad)}
.mov-list{display:grid;gap:0}
.mov{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.mov .tag{font-size:.7rem;padding:2px 7px;border-radius:999px;background:var(--empty);color:var(--muted);font-weight:600}
.mov .tag.hormiga{background:var(--ant-soft);color:var(--ant)}
.mov .tag.ingreso{background:var(--ok-soft);color:var(--ok)}
.mov .d{font-size:.78rem;color:var(--muted)}
.mov .amt{font-family:var(--num);font-weight:600}
.mov .amt.ingreso{color:var(--ok)}
/* Cards */
.card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:var(--surface2)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.card-h input{font-weight:700;font-size:1rem;max-width:260px}
.bar{height:10px;border-radius:99px;background:var(--empty);overflow:hidden;margin:10px 0 4px}
.bar>span{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar>span.warn{background:var(--warn)} .bar>span.bad{background:var(--bad)}
.subtle{font-size:.8rem;color:var(--muted)}
details{margin-top:12px}
summary{cursor:pointer;font-weight:600;font-size:.9rem;padding:4px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.chart svg{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;font-size:.9rem;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast button{background:none;border:none;color:var(--surface);font-weight:700;text-decoration:underline;cursor:pointer}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .quick{grid-template-columns:1fr 1fr}
  .r-ing,.r-gas,.r-deu,.r-mov{grid-template-columns:1fr 1fr}
  .r-ing>:first-child,.r-gas>:first-child,.r-deu>:first-child,.r-mov>:nth-child(2){grid-column:1/-1}
  .r-tar{grid-template-columns:1fr 1fr}
  .row .icon-btn{justify-self:end}
  section.panel{padding:14px}
}
@media (prefers-reduced-motion: no-preference){
  .bar>span{transition:width .4s ease}
}

/* ---- App: login, cuenta, ahorros ---- */
.screen{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.login{max-width:420px;width:100%;text-align:left}
.login .logo{width:64px;height:64px;border-radius:16px;display:block;margin-bottom:22px}
.login h1{font-family:var(--num);font-size:2rem;line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
.login p{color:var(--muted);margin:0 0 22px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:1rem;cursor:pointer}
.gbtn:hover{border-color:var(--brand)}
.gbtn svg{width:20px;height:20px}
.login .fine{font-size:.8rem;color:var(--muted);margin-top:16px}
.login ul{padding-left:18px;color:var(--muted);margin:0 0 24px}
.login li{margin-bottom:4px}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);cursor:pointer;padding:0;overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:16px;top:58px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:250px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.18);display:grid;gap:6px}
.menu .who{font-weight:600}
.menu .mail{font-size:.8rem;color:var(--muted);margin-bottom:6px;word-break:break-all}
.menu .btn{text-align:left}
.top-in{position:relative}
.r-aho{grid-template-columns:2fr 1.4fr 1.2fr 1.2fr .9fr 1.2fr auto}
@media (max-width:760px){ .r-aho{grid-template-columns:1fr 1fr} .r-aho>:first-child{grid-column:1/-1} }

.badge{display:inline-block;font-family:var(--body);font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--empty);color:var(--muted);vertical-align:2px;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)}
.sub-h{font-family:var(--num);font-size:.98rem;font-weight:600;margin:16px 0 10px}
.realmin{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:4px 14px;align-items:end;margin-top:12px}
.realmin label{display:grid;gap:3px;font-size:.75rem;color:var(--muted)} .realmin input{width:100%;background:var(--surface)} .realmin p{margin:0 0 8px}
@media (max-width:760px){ .realmin{grid-template-columns:1fr} .realmin p{margin:0} }
.paybox{margin-top:12px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.payform{display:grid;grid-template-columns:1.2fr 1.4fr 1.2fr auto;gap:8px;align-items:end}
.payform label{display:grid;gap:3px;font-size:.75rem;color:var(--muted)} .payform input,.payform select{width:100%}
.nmrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.nm{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;gap:2px;font-size:.75rem;color:var(--muted)}
.nm b{color:var(--ink);font-size:.82rem;font-weight:600}
.r-cmp{grid-template-columns:1.1fr 2fr 1.2fr .7fr 1.2fr auto}
.addrow{margin-top:8px;background:transparent;border-style:dashed}
@media (max-width:760px){
  .payform{grid-template-columns:1fr 1fr} .payform .btn{grid-column:1/-1}
  .nmrow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .r-cmp{grid-template-columns:1fr 1fr} .r-cmp>:nth-child(2){grid-column:1/-1} .r-cmp.addrow .btn{grid-column:1/-1}
}
.badge.muted{background:var(--empty);color:var(--muted);font-style:italic}
.evalbox{margin-top:12px;padding:12px 14px;border-radius:10px;border-left:4px solid var(--brand);background:var(--surface)}
.evalbox p{margin:0 0 6px;font-size:.88rem} .evalbox p:last-child{margin-bottom:0}
.evalbox .tip{padding-left:2px;color:var(--ink)} .evalbox .tip.warn{color:var(--warn)} .evalbox .tip.bad{color:var(--bad);font-weight:600}
.orden{margin:0;padding-left:22px;display:grid;gap:4px;font-size:.92rem}
.goal{margin:14px 0 12px}
.goal-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.goal-pct{font-size:2rem;font-weight:700;letter-spacing:-.02em}
.bar.big{height:14px;margin-top:6px}
.spark{width:100%;height:90px;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.spark .ln{fill:none;stroke:var(--ok);stroke-width:2.2;vector-effect:non-scaling-stroke}
.spark .tgt{stroke:var(--muted);stroke-dasharray:5 4;stroke-width:1.2;vector-effect:non-scaling-stroke}
.spark .mk{stroke:var(--brand);stroke-width:1.2;vector-effect:non-scaling-stroke}
.chip.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.hq{border-color:var(--ant)}
.hchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin:8px 0 10px}
.hchip{display:grid;justify-items:center;gap:2px;padding:9px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer;font-size:.78rem;line-height:1.2;text-align:center}
.hchip:hover{border-color:var(--ant)} .hchip .hi{font-size:1.35rem;line-height:1} .hchip .hv{font-size:.72rem;color:var(--muted)}
.hchip.on{background:var(--ant-soft);border-color:var(--ant);color:var(--ant);font-weight:700}
.hform{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.hform input{font-size:1.05rem;min-width:0}
.vts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.vt{all:unset;box-sizing:border-box;display:grid;gap:6px;align-content:start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer}
.vt:hover{border-color:var(--brand)} .vt:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.vt-wide{grid-column:1/-1}
.vt-h{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted)} .vt-h b{font-weight:700;text-align:right}
.vt-n{font-size:1.45rem;font-weight:700;letter-spacing:-.02em} .vt-n small{font-size:.8rem;font-weight:500;color:var(--muted)}
.vt-s{font-size:.8rem;color:var(--muted)} .vt .bar{margin:2px 0}
.vt-meta{display:grid;gap:4px} .vt-meta .vt-h span{color:var(--ink);font-weight:600}
.okc{color:var(--ok)} .badc{color:var(--bad)} .warnc{color:var(--warn)} .ant{color:var(--ant)}
@media (max-width:760px){ .hchips{grid-template-columns:repeat(3,1fr)} .hform{grid-template-columns:1fr 1fr} .hform input{grid-column:1/-1} }

/* ---- Estado de guardado ---- */
.status{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;flex-basis:auto !important;width:max-content;max-width:100%}
.status.st-ok{background:var(--ok-soft);color:var(--ok)} .status.st-saving{background:var(--warn-soft);color:var(--warn)}
.status.st-bad{background:var(--bad-soft);color:var(--bad)} .status.st-warn{background:var(--empty);color:var(--muted)}
.helpbtn{font-family:var(--num);font-size:1.05rem;color:var(--brand);border-color:var(--brand)}
.hb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-weight:700;font-size:.78rem;cursor:pointer;vertical-align:2px;margin-left:4px;padding:0}
.hb:hover{border-color:var(--brand);color:var(--brand)}
/* ---- Cuadros que se compactan ---- */
.fold{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer;margin-bottom:8px}
.fold:hover{border-color:var(--brand)} .fold:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.fs-t{display:grid;gap:2px;flex:1;min-width:0} .fs-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-t small{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-b .badge{margin-left:0;margin-top:3px}
.payform .gcheck{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ink)}
.fs-r{text-align:right;font-weight:600;white-space:nowrap;display:grid} .fs-r small{font-size:.72rem;color:var(--muted);font-weight:500}
.fs-e{font-size:.8rem;color:var(--brand);font-weight:600;white-space:nowrap}
.card.open{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
.foldbar{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.foldfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.card.open .row{background:transparent}
/* ---- Próximos pagos ---- */
.plist{display:grid;gap:6px}
.pitem{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);cursor:pointer}
.pitem:hover{border-color:var(--brand)} .ptxt{flex:1;display:grid;gap:1px;min-width:0} .ptxt small{color:var(--muted);font-size:.78rem}
/* ---- Guía ---- */
.en-guia nav.tabs,.en-guia .monthpick{display:none}
.guia{max-width:640px;margin-left:auto;margin-right:auto}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.gprog{display:flex;gap:4px;margin:0 0 16px;flex-wrap:wrap}
.gprog span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:.72rem;font-weight:600;padding:6px 4px;border-radius:999px;background:var(--empty);color:var(--muted)}
.gprog span.on{background:var(--brand);color:var(--brand-ink)} .gprog span.done{background:var(--ok-soft);color:var(--ok)}
.gbody{display:grid;gap:10px}
.bub{display:flex;gap:10px;align-items:flex-start;animation:bubIn .25s ease both}
.bav{flex:0 0 32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--num);font-size:.72rem;font-weight:700}
.btxt{background:var(--surface2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:.98rem;line-height:1.45}
@keyframes bubIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.bub{animation:none}}
.gform{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;background:var(--surface);margin-left:42px}
.gq{display:grid;gap:6px} .glab{font-weight:600;font-size:.92rem} .ghint{margin:0;font-size:.8rem;color:var(--muted)}
.gq input{width:100%;font-size:1rem;padding:10px 12px} .gq input.gbig{font-family:var(--num);font-size:1.4rem;font-weight:600}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 13px;font-size:.88rem;cursor:pointer;font-weight:500}
.gchip:hover{border-color:var(--brand)} .gchip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;margin-left:42px}
.btn.big{padding:12px 18px;font-size:1rem}
.linkbtn{all:unset;cursor:pointer;color:var(--muted);font-size:.85rem;text-decoration:underline;margin-left:42px;justify-self:start}
.glist{display:grid;gap:6px;margin-left:42px}
.gitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.gok{color:var(--ok);font-weight:700} .gsum{flex:1;min-width:0;font-size:.92rem}
.gchoices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-left:42px}
.gchoice{all:unset;box-sizing:border-box;display:grid;gap:3px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer}
.gchoice:hover{border-color:var(--brand)} .gchoice:focus-visible{outline:2px solid var(--brand)}
.gchoice span{font-size:1.5rem} .gchoice small{color:var(--muted);font-size:.8rem}
.gcheck{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.gcheck input{width:auto}
.gfinal{margin-left:42px;text-align:center;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.gfinal p{margin:0} .gfinal .big{font-family:var(--num);font-weight:700;font-size:clamp(2.4rem,9vw,3.6rem);letter-spacing:-.03em;line-height:1.1;margin:4px 0}
.gfinal .big.neg{color:var(--bad)}
.gbanner{border-color:var(--brand)} .gbanner .gbtns{margin-top:10px}
/* ---- Ayuda ---- */
.modal-open{overflow:hidden}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,25,.55);display:flex;justify-content:flex-end}
.sheet{width:min(520px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px calc(10px) ;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-family:var(--num)} .sheet-b{overflow-y:auto;padding:16px 18px 40px}
.sheet-b .btn.big{width:100%}
.hq-item{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--surface2)}
.hq-item summary{padding:12px 14px;font-weight:600;cursor:pointer;margin:0}
.hq-item[open] summary{border-bottom:1px solid var(--line)}
.hq-b{padding:4px 14px 12px;font-size:.92rem} .hq-b p{margin:8px 0} .hq-b ul,.hq-b ol{padding-left:20px;margin:8px 0} .hq-b li{margin-bottom:4px}
.glos dt{font-weight:700;margin-top:8px} .glos dd{margin:2px 0 0;color:var(--muted)}
@media (max-width:760px){ .gform,.gbtns,.glist,.gchoices,.gfinal,.linkbtn{margin-left:0} .gform{padding:14px} .foldbar .fs-r{display:none} }
.offline{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:.82rem;padding:6px}

/* v8: logo, ventanas, topes */
.hlogo{width:26px;height:26px;border-radius:7px;vertical-align:-6px;margin-right:8px}
img.bav{object-fit:cover;background:none;padding:0;border-radius:9px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;cursor:pointer;font-size:inherit}
.alert .linkbtn{color:inherit;font-weight:600}
.menu{max-height:calc(100vh - 80px);overflow-y:auto}
.msep{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 0;border-top:1px solid var(--line);padding-top:8px}
textarea{font:inherit;color:inherit;width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;margin-top:4px}
.sheet-b .alert{margin:10px 0}
.cbars{display:grid;gap:10px;margin-top:10px}
.cbar .bar{margin:4px 0 0;height:9px}
.cbar-h{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.cbar-h small{color:var(--muted);margin-left:4px}
.bar>span.neu{background:var(--brand)}
.trows{display:grid;gap:4px;margin-top:10px}
.trow{display:grid;grid-template-columns:1fr auto 150px;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.tcat{font-weight:600}
.tgast{text-align:right}
.ttope{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.ttope input{width:100%;padding:6px 8px}
.tbar{grid-column:1/3;margin:0;height:7px}
.tmsg{font-size:.78rem;color:var(--muted);text-align:right}
.tmsg.warn{color:var(--warn)} .tmsg.bad{color:var(--bad);font-weight:600}
@media (max-width:520px){ .trow{grid-template-columns:1fr auto} .ttope{grid-column:1/-1} .tbar{grid-column:1/2} }
.pitem a.btn{white-space:nowrap;text-decoration:none}
</style>
</head>
<body>
<div id="root"><div class="screen"><p class="status">Cargando…</p></div></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
